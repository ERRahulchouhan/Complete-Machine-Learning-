<style>

:root[data-theme=light]{color-scheme:light;--bg:#eef1f3;--panel:#f8f9fa;--code:#e4e9ec;--text:#2b3339;--mute:#66727b;--acc:#3a7a5e;--out:#7a5f1c;--line:#d3dadf}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Georgia,"Iowan Old Style",serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 18px;font-family:system-ui,sans-serif}
header h1{font-size:17px;margin:0;flex:0 0 auto;font-weight:600}
#q{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:15px system-ui}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:13px system-ui}
button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;max-width:1100px;margin:0 auto;padding:22px 18px 80px}
nav{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;font:14px system-ui}
nav a{display:block;color:var(--mute);text-decoration:none;padding:4px 8px;border-left:2px solid var(--line)}
nav a:hover{color:var(--acc);border-color:var(--acc)}
.intro{color:var(--mute);max-width:70ch}
h2{font-size:22px;margin:38px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
.item .n{padding:10px 16px 0;font-size:15px}
.item.hide,section.hide{display:none}
pre{margin:8px 0 0;padding:12px 16px;overflow-x:auto;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--code);position:relative}
pre.c{color:var(--text)}
pre.o{color:var(--out);margin-top:0;border-top:1px dashed var(--line)}
.cp{position:absolute;right:8px;top:8px;font-size:11px;padding:2px 8px}
.tip{border-left:3px solid var(--acc);background:var(--panel);padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0;font-size:15px}
:root{--red:#e58a8a}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--red:#b0413e}}

.item.imp{border-left:4px solid var(--red)}
.item.imp .n{color:var(--red);font-weight:600}
.tag{margin-left:10px;font:12px system-ui;border:1px solid var(--red);color:var(--red);border-radius:10px;padding:0 8px}
body.onlyimp .item:not(.imp),body.onlyimp section.noimp{display:none}
@media(max-width:760px){.wrap{display:block}nav{display:none}header h1{display:none}}
</style>

<body>

<p class="intro">Methods used most while developing and shipping ML models, each with its output. Every example uses the sample data below (pandas 2.x). Printed output may differ slightly in spacing from your terminal.</p>

A("0. Sample data used everywhere",[

df = pd.DataFrame({
  'id':[1,2,3,4,5],
  'name':['Asha','Ravi','Meena','Kiran','Zoya'],
  'dept':['HR','IT','IT','Ops','HR'],
  'salary':[50000,72000,68000,None,55000],
  'joined':pd.to_datetime(['2021-03-15','2020-07-01','2022-01-10','2023-05-20','2019-11-30'])})
df`,
`   id   name dept   salary     joined
0   1   Asha   HR  50000.0 2021-03-15
1   2   Ravi   IT  72000.0 2020-07-01
2   3  Meena   IT  68000.0 2022-01-10
3   4  Kiran  Ops      NaN 2023-05-20
4   5   Zoya   HR  55000.0 2019-11-30`]]);

A("1. Read and write data",[

pd.read_csv('big.csv', chunksize=100_000)   # iterator of DataFrames

pd.read_sql('SELECT * FROM emp', conn)`,

df.to_excel('out.xlsx', index=False)
df.to_sql('emp', conn, if_exists='replace', index=False)`,
`# files written, returns None`]]);

A("2. Inspect",[

A("3. Select rows and columns",[

   name   salary

A("4. Filter",[
["Boolean mask","df[df['salary'] > 60000][['name','salary']]","    name   salary\n1   Ravi  72000.0\n2  Meena  68000.0"],

A("5. Missing values",[
["Count missing","df.isna().sum()","id        0\nname      0\ndept      0\nsalary    1\njoined    0\ndtype: int64"],
["fillna","df['salary'].fillna(df['salary'].median())","0    50000.0\n1    72000.0\n2    68000.0\n3    61500.0\n4    55000.0\nName: salary, dtype: float64"],
["dropna","df.dropna(subset=['salary']).shape","(4, 5)"],
["interpolate / ffill","pd.Series([1,None,3]).interpolate().tolist()\npd.Series([1,None,3]).ffill().tolist()","[1.0, 2.0, 3.0]\n[1.0, 1.0, 3.0]"]]);

A("6. Create and transform columns",[
["Vectorised math (fast)","df['bonus'] = df['salary'] * 0.1\ndf['bonus']","0    5000.0\n1    7200.0\n2    6800.0\n3       NaN\n4    5500.0\nName: bonus, dtype: float64"],

["pd.cut: bins","pd.cut(df['salary'], [0,55000,100000], labels=['low','high']).tolist()","['low', 'high', 'high', nan, 'low']"],
["rename / drop","df.rename(columns={'name':'emp_name'}).columns.tolist()\ndf.drop(columns=['joined']).shape","['id', 'emp_name', 'dept', 'salary', 'joined']\n(5, 4)"],
["astype","df['id'].astype('int32').dtype","dtype('int32')"],
["assign (chain friendly)","df.assign(k=df.salary/1000)['k'].tolist()","[50.0, 72.0, 68.0, nan, 55.0]"]]);

A("7. String methods (.str)",[
["Clean text","s = pd.Series([' Asha ','RAVI','meena'])\ns.str.strip().str.title()","0     Asha\n1     Ravi\n2    Meena\ndtype: object"],
["contains / replace / split","s.str.lower().str.contains('a').tolist()\ns.str.strip().str.replace('a','4').tolist()\npd.Series(['a-b','c-d']).str.split('-').tolist()",
"[True, True, True]\n['Ash4', 'RAVI', 'meen4']\n[['a', 'b'], ['c', 'd']]"],

A("8. Sort and rank",[
["sort_values","df.sort_values('salary', ascending=False)[['name','salary']]","    name   salary\n1   Ravi  72000.0\n2  Meena  68000.0\n4   Zoya  55000.0\n0   Asha  50000.0\n3  Kiran      NaN"],
["rank","df['salary'].rank(ascending=False)","0    4.0\n1    1.0\n2    2.0\n3    NaN\n4    3.0\nName: salary, dtype: float64"],
["nlargest","df.nlargest(2,'salary')['name'].tolist()","['Ravi', 'Meena']"]]);

A("9. GroupBy and aggregation",[
["Simple mean","df.groupby('dept')['salary'].mean()","dept\nHR     52500.0\nIT     70000.0\nOps        NaN\nName: salary, dtype: float64"],
["Named aggregation (best form)","df.groupby('dept').agg(n=('id','count'), avg=('salary','mean'), top=('salary','max'))","      n      avg      top\ndept                      \nHR    2  52500.0  55000.0\nIT    2  70000.0  72000.0\nOps   1      NaN      NaN"],
["transform: group stat back on every row (great for features)","df.groupby('dept')['salary'].transform('mean')","0    52500.0\n1    70000.0\n2    70000.0\n3        NaN\n4    52500.0\nName: salary, dtype: float64"],
["Basic stats","df['salary'].agg(['min','max','mean'])\ndf['salary'].quantile(0.9)","min     50000.0\nmax     72000.0\nmean    61250.0\nName: salary, dtype: float64\n70800.0"]]);

A("10. Merge, join, concat",[
["merge (SQL join)","d = pd.DataFrame({'dept':['HR','IT'],'head':['Nina','Omar']})\ndf.merge(d, on='dept', how='left')[['name','dept','head']]",
"    name dept  head\n0   Asha   HR  Nina\n1   Ravi   IT  Omar\n2  Meena   IT  Omar\n3  Kiran  Ops   NaN\n4   Zoya   HR  Nina"],
["Safe merge: catches duplicate keys","df.merge(d, on='dept', how='left', validate='m:1')","# raises MergeError if d has duplicate dept values"],
["concat","pd.concat([df.head(1), df.tail(1)]).shape\npd.concat([df, df], axis=1).shape","(2, 5)\n(5, 10)"]]);

A("11. Reshape",[
["pivot_table","df.pivot_table(index='dept', values='salary', aggfunc='mean')","      salary\ndept        \nHR   52500.0\nIT   70000.0"],
["melt: wide to long","w = pd.DataFrame({'id':[1,2],'q1':[10,20],'q2':[30,40]})\nw.melt(id_vars='id')","   id variable  value\n0   1       q1     10\n1   2       q1     20\n2   1       q2     30\n3   2       q2     40"],
["get_dummies: one-hot","pd.get_dummies(df['dept'], dtype=int)","   HR  IT  Ops\n0   1   0    0\n1   0   1    0\n2   0   1    0\n3   0   0    1\n4   1   0    0"]]);

[".dt accessor","df['joined'].dt.year.tolist()\ndf['joined'].dt.day_name().head(2).tolist()","[2021, 2020, 2022, 2023, 2019]\n['Monday', 'Wednesday']"],
["date_range","pd.date_range('2024-01-01', periods=3, freq='D')","DatetimeIndex(['2024-01-01', '2024-01-02', '2024-01-03'], dtype='datetime64[ns]', freq='D')"],
["Tenure feature","(pd.Timestamp('2024-01-01') - df['joined']).dt.days.tolist()","[1022, 1280, 721, 226, 1494]"]]);

A("13. Window and lag features",[
["rolling / cumsum / shift / diff","s = pd.Series([1,2,3,4,5])\ns.rolling(3).mean().tolist()\ns.cumsum().tolist()\ns.shift(1).tolist()\ns.diff().tolist()",
"[nan, nan, 2.0, 3.0, 4.0]\n[1, 3, 6, 10, 15]\n[nan, 1.0, 2.0, 3.0, 4.0]\n[nan, 1.0, 1.0, 1.0, 1.0]"],
["Per-group lag (no leakage across groups)","df.sort_values('joined').groupby('dept')['salary'].shift(1)","# previous salary within the same dept"]]);

A("14. Duplicates and cleaning",[
["Find and drop","df.duplicated().sum()\ndf.drop_duplicates(subset='dept').shape","0\n(3, 5)"],

A("15. Production practices",[
["Shrink memory with category and downcast","df['dept'] = df['dept'].astype('category')\ndf['dept'].cat.categories\ndf['id'] = pd.to_numeric(df['id'], downcast='integer')",
"Index(['HR', 'IT', 'Ops'], dtype='object')"],
["Measure memory","df.memory_usage(deep=True).sum()","# bytes; compare before and after dtype changes"],
["Avoid chained assignment: use loc and copy()","sub = df[df['salary'] > 60000].copy()\nsub.loc[:, 'flag'] = 1","# no SettingWithCopyWarning"],
["Validate input data before training","assert df['id'].is_unique\nassert df['salary'].dropna().ge(0).all()\nassert {'id','salary'} <= set(df.columns)","# passes silently, raises AssertionError on bad data"],
["pipe: readable, testable pipeline","def clean(d): return d.dropna(subset=['salary'])\ndef feat(d): return d.assign(k=d['salary']/1000)\n\nout = df.pipe(clean).pipe(feat)\nout['k'].tolist()","[50.0, 72.0, 68.0, 55.0]"],
["Train/test split without sklearn","train = df.sample(frac=0.8, random_state=42)\ntest = df.drop(train.index)\nlen(train), len(test)","(4, 1)"],
["Save the exact feature columns used in training","import json\njson.dump(list(X.columns), open('features.json','w'))\nX_live = X_live.reindex(columns=json.load(open('features.json')), fill_value=0)","# guarantees same column order at inference"],
["Display settings","pd.set_option('display.max_columns', 50)\npd.set_option('display.float_format', '{:.2f}'.format)","# affects printing only"]]);

A("16. filter, where, mask and selection helpers",[
["df.filter(): pick columns by name (items, like, regex)","df.filter(items=['id','name']).columns.tolist()\ndf.filter(like='a').columns.tolist()\ndf.filter(regex='^s').columns.tolist()\ndf.filter(items=[0,2], axis=0).index.tolist()","['id', 'name']\n['name', 'salary']\n['salary']\n[0, 2]"],

["String / date filters","df[df['name'].str.startswith('A')]['name'].tolist()\ndf[df['joined'] > '2021-01-01']['name'].tolist()","['Asha']\n['Asha', 'Meena', 'Kiran']"],

["at / iat: fast single value","df.at[1, 'name']\ndf.iat[0, 1]\ndf.iloc[-1]['name']","'Ravi'\n'Asha'\n'Zoya'"],

A("17. Add, remove, rename, reorder",[
["insert / pop","df.insert(1, 'country', 'IN')\ndf.columns.tolist()\nd = df.pop('dept')   # removes column and returns it","['id', 'country', 'name', 'dept', 'salary', 'joined']"],
["drop rows and columns","df.drop(index=[0, 1]).shape\ndf.drop(columns=['id', 'dept']).shape","(3, 5)\n(5, 3)"],

["rename all at once; prefix / suffix","df.columns = df.columns.str.upper()\ndf.add_prefix('f_').columns.tolist()\ndf.rename(str.title, axis=1).columns.tolist()","['f_id', 'f_name', 'f_dept', 'f_salary', 'f_joined']\n['Id', 'Name', 'Dept', 'Salary', 'Joined']"],
["reset_index / sort_index / set_index","df.set_index('name').loc['Ravi', 'dept']\ndf.reset_index(drop=True)\ndf.sort_index(ascending=False).index.tolist()","'IT'\n# index back to 0..n-1\n[4, 3, 2, 1, 0]"],
["copy (avoid changing the original)","d2 = df.copy()","# independent deep copy"],
["replace values","df['dept'].replace({'HR': 'People'}).tolist()\ndf['salary'].replace(np.nan, 0).tolist()\ndf.replace('?', np.nan)","['People', 'IT', 'IT', 'Ops', 'People']\n[50000.0, 72000.0, 68000.0, 0.0, 55000.0]"],
["Conditional assignment with loc","df.loc[df['salary'].isna(), 'salary'] = 0\ndf.loc[df['dept'] == 'IT', 'grade'] = 'A'","# sets values in place for rows that match"],

["DataFrame.map: element-wise (old name applymap)","df[['id']].map(lambda x: x * 2)['id'].tolist()","[2, 4, 6, 8, 10]"],
