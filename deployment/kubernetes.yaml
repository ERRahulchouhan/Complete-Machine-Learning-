apiVersion: apps/v1
kind: Deployment
metadata:
  name: regression-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regression-inference
  template:
    metadata:
      labels:
        app: regression-inference
    spec:
      containers:
        - name: inference
          image: complete-machine-learning:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
